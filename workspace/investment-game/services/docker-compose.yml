services:
  controller:
    build: ./controller
    container_name: controller
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./controller/observations/:/observations
      - ./controller/app/:/app:ro

  speech:
    build: ./speech
    container_name: speech
    env_file:
      - .env
    ports:
      - "9559:9559"
      - "9700:9700"
      - "9701:9701"
      - "9702:9702"
    environment:
      - OMP_NUM_THREADS=3
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=1
      - TORCH_NUM_THREADS=1
      - TORCH_NUM_INTEROP_THREADS=1
    volumes:
      - ./speech/app/:/app:ro
      - ./speech/audio_debug:/tmp/audio_debug

  pepper:
    build: ./pepper
    container_name: naoqi
    env_file:
      - .env
    environment:
      - SOCKET_SERVER_HOST=speech
      - SOCKET_SERVER_PORT=9700
      - REMOTE_REC_PORT=9702
    depends_on:
      - speech
    volumes:
      - ./pepper/app/:/app:ro

  tts:
    build: ./piper
    container_name: piper
    env_file:
      - .env
    environment:
      - PIPER_MODEL_ROOT=/models
      - PIPER_PATH=/usr/local/bin/piper
      - JACK_NO_START_SERVER=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    volumes:
      - ./piper/models:/models
