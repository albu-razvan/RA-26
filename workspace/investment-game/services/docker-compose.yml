services:
  controller:
    build: ./controller
    container_name: controller
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
    ports:
      - "8000:8000"
    volumes:
      - ./controller/observations/:/observations
      - ./controller/app/:/app:ro

  speech:
    build: ./speech
    container_name: speech
    environment:
      - ROBOT_IP=${ROBOT_IP}
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "9559:9559"
      - "9700:9700"
      - "9701:9701"
      - "9702:9702"
    volumes:
      - ./speech/app/:/app:ro
      - ./speech/audio_debug:/tmp/audio_debug

  pepper:
    build: ./pepper
    container_name: naoqi
    environment:
      - ROBOT_IP=${ROBOT_IP}
      - SOCKET_SERVER_HOST=speech
      - SOCKET_SERVER_PORT=9700
      - REMOTE_REC_PORT=9702
    depends_on:
      - speech
    volumes:
      - ./pepper/app/:/app:ro

  tts:
    build: ./piper
    container_name: piper
    command: >
      --m /models/androgynous/model
      --length-scale 0.72
      --noise-scale 0.9
      --noise-w-scale 0.8
      --host 0.0.0.0
    volumes:
      - ./piper/models:/models
